[build]
  base = "backend"
  command = "npm ci && npm run build && npm --prefix ../frontend ci && npm --prefix ../frontend run build"
  publish = "../frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "/"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "@prisma/adapter-pg", "pg"]
  included_files = ["node_modules/.prisma/client/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
